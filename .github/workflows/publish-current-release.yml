name: Publish current declared release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: current-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified current release set
    if: >-
      github.repository == 'trafficolog/yandex-ai-plugins-skills' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: trafficolog/yandex-ai-plugins-skills

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Validate declared release manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_manifest.py validate
          python scripts/release_manifest.py items --format tsv > /tmp/release-items.tsv
          test -s /tmp/release-items.tsv

      - name: Detect declared release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          python scripts/release_manifest.py items --format tsv > /tmp/release-items.tsv

          remote_tag_exists() {
            local tag="$1" rc
            set +e
            git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1
            rc=$?
            set -e
            case "$rc" in
              0) return 0 ;;
              2) return 1 ;;
              *)
                echo "Unable to determine remote tag state for $tag (git ls-remote rc=$rc)." >&2
                exit "$rc"
                ;;
            esac
          }

          candidates=()
          total=0
          published=0
          drafts=0

          while IFS=$'\t' read -r kind name version tag title notes_file; do
            total=$((total + 1))
            state=""
            if state="$(gh release view "$tag" --repo "$GH_REPO" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv' 2>/dev/null)"; then
              IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
              if [[ "$is_draft" == "true" ]]; then
                if remote_tag_exists "$tag"; then
                  echo "Draft release $tag unexpectedly has a remote Git tag." >&2
                  exit 1
                fi
                if [[ ! "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  echo "Draft release $tag has non-immutable target: $target" >&2
                  exit 1
                fi
                candidates+=("${target,,}")
                drafts=$((drafts + 1))
              else
                if [[ "$is_immutable" != "true" ]]; then
                  echo "Published release $tag is not immutable." >&2
                  exit 1
                fi
                if ! remote_tag_exists "$tag"; then
                  echo "Published release $tag has no remote Git tag." >&2
                  exit 1
                fi
                git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
                tag_sha="$(git rev-list -n 1 "$tag")"
                if [[ "$target" != "$tag_sha" ]]; then
                  echo "Published release $tag target $target disagrees with tag SHA $tag_sha." >&2
                  exit 1
                fi
                candidates+=("$tag_sha")
                published=$((published + 1))
              fi
            elif remote_tag_exists "$tag"; then
              echo "Standalone remote tag $tag exists without a GitHub Release." >&2
              exit 1
            fi
          done < /tmp/release-items.tsv

          if [[ "$total" -lt 1 ]]; then
            echo "Release manifest normalized to an empty release set." >&2
            exit 1
          fi

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          stale=false

          if [[ "${#candidates[@]}" -eq 0 ]]; then
            if [[ "$live_main" != "$TARGET_SHA" ]]; then
              echo "Stale successful main CI run; no publication required. live=$live_main target=$TARGET_SHA"
              stale=true
              release_target=""
            else
              release_target="$TARGET_SHA"
            fi
            initial=true
          else
            release_target="${candidates[0]}"
            for sha in "${candidates[@]}"; do
              if [[ "$sha" != "$release_target" ]]; then
                echo "Existing declared release state spans multiple commits: ${candidates[*]}" >&2
                exit 1
              fi
            done
            if ! git merge-base --is-ancestor "$release_target" "$live_main"; then
              echo "Existing release target $release_target is not an ancestor of live main $live_main." >&2
              exit 1
            fi
            initial=false
          fi

          if [[ "$stale" == "false" && "$published" -eq "$total" && "$drafts" -eq 0 ]]; then
            complete=true
          else
            complete=false
          fi

          echo "release_target=$release_target" >> "$GITHUB_OUTPUT"
          echo "initial=$initial" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Report stale successful CI no-op
        if: steps.state.outputs.stale == 'true'
        shell: bash
        run: |
          echo "Stale successful main CI run; no publication required."

      - name: Verify exact release target
        if: steps.state.outputs.complete != 'true' && steps.state.outputs.stale != 'true'
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_TARGET^{commit}"

          git show "$RELEASE_TARGET:.github/releases/release.json" > /tmp/target-release.json
          if ! cmp -s .github/releases/release.json /tmp/target-release.json; then
            echo "Release manifest changed after the selected recovery target." >&2
            exit 1
          fi

          WT="$(mktemp -d)"
          cleanup_worktree() {
            git worktree remove --force "$WT" >/dev/null 2>&1 || true
          }
          trap cleanup_worktree EXIT
          git worktree add --detach "$WT" "$RELEASE_TARGET"
          (
            cd "$WT"
            python scripts/release_manifest.py validate
            python scripts/validate_repo.py
            python -m unittest discover -s tests -v
          )

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          if [[ "${{ steps.state.outputs.initial }}" == "true" ]]; then
            if [[ "$live_main" != "$TARGET_SHA" || "$RELEASE_TARGET" != "$TARGET_SHA" ]]; then
              echo "Late stale-main guard failed." >&2
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$RELEASE_TARGET" "$live_main"; then
            echo "Recovery target is no longer an ancestor of live main." >&2
            exit 1
          fi

      - name: Publish declared immutable release set
        if: steps.state.outputs.complete != 'true' && steps.state.outputs.stale != 'true'
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/release_manifest.py items --format tsv > /tmp/release-items.tsv

          remote_tag_exists() {
            local tag="$1" rc
            set +e
            git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1
            rc=$?
            set -e
            case "$rc" in
              0) return 0 ;;
              2) return 1 ;;
              *)
                echo "Unable to determine remote tag state for $tag (git ls-remote rc=$rc)." >&2
                exit "$rc"
                ;;
            esac
          }

          rollback_published_release() {
            local tag="$1" original_rc="$2" probe_rc cleanup_release_immutable
            trap - ERR
            set +e
            if [[ "$rollback_armed" != "true" ]]; then
              exit "$original_rc"
            fi
            rollback_armed=false

            cleanup_release_immutable="$(gh release view "$tag" --repo "$GH_REPO" --json isImmutable --jq '.isImmutable' 2>/dev/null)"
            probe_rc=$?
            if [[ "$probe_rc" -ne 0 ]]; then
              echo "Unable to determine release immutability for $tag; refusing destructive rollback." >&2
              exit "$original_rc"
            fi
            if [[ "$cleanup_release_immutable" == "true" ]]; then
              echo "Release $tag is already immutable; rollback is neither required nor safe." >&2
              exit "$original_rc"
            fi
            if [[ "$cleanup_release_immutable" != "false" ]]; then
              echo "Unable to determine release immutability for $tag; refusing destructive rollback." >&2
              exit "$original_rc"
            fi

            echo "Publication verification failed for $tag; attempting fail-closed cleanup." >&2
            gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag >/dev/null 2>&1
            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "Rollback residue: release $tag remains." >&2
            fi
            git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1
            probe_rc=$?
            if [[ "$probe_rc" -eq 0 ]]; then
              echo "Rollback residue: tag $tag remains." >&2
            elif [[ "$probe_rc" -ne 2 ]]; then
              echo "Rollback verification could not determine tag state for $tag (rc=$probe_rc)." >&2
            fi
            exit "$original_rc"
          }

          publish_one() {
            local kind="$1" name="$2" version="$3" tag="$4" title="$5" notes_file="$6"
            local state="" is_draft="" is_immutable="" target="" tag_sha=""
            local published_state="" published_is_draft="" published_is_immutable="" published_target_commitish=""
            local notes_tmp rollback_armed=false

            notes_tmp="$(mktemp)"
            git show "$RELEASE_TARGET:$notes_file" > "$notes_tmp"

            if state="$(gh release view "$tag" --repo "$GH_REPO" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv' 2>/dev/null)"; then
              IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
              if [[ "$target" != "$RELEASE_TARGET" ]]; then
                echo "$tag targets $target, expected $RELEASE_TARGET." >&2
                rm -f "$notes_tmp"
                exit 1
              fi
              if [[ "$is_draft" != "true" ]]; then
                if [[ "$is_immutable" != "true" ]]; then
                  echo "Published release $tag is not immutable." >&2
                  rm -f "$notes_tmp"
                  exit 1
                fi
                if ! remote_tag_exists "$tag"; then
                  echo "Published release $tag has no remote Git tag." >&2
                  rm -f "$notes_tmp"
                  exit 1
                fi
                git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
                tag_sha="$(git rev-list -n 1 "$tag")"
                if [[ "$tag_sha" != "$RELEASE_TARGET" ]]; then
                  echo "$tag points to $tag_sha, expected $RELEASE_TARGET." >&2
                  rm -f "$notes_tmp"
                  exit 1
                fi
                rm -f "$notes_tmp"
                echo "$tag already published at exact immutable target."
                return 0
              fi
              if remote_tag_exists "$tag"; then
                echo "Draft $tag unexpectedly has a remote tag." >&2
                rm -f "$notes_tmp"
                exit 1
              fi
            else
              if remote_tag_exists "$tag"; then
                echo "Standalone remote tag $tag exists without a GitHub Release." >&2
                rm -f "$notes_tmp"
                exit 1
              fi
              gh release create "$tag" --repo "$GH_REPO" --draft --target "$RELEASE_TARGET" --title "$title" --notes-file "$notes_tmp"
              state="$(gh release view "$tag" --repo "$GH_REPO" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish] | @tsv')"
              IFS=$'\t' read -r is_draft target <<< "$state"
              if [[ "$is_draft" != "true" || "$target" != "$RELEASE_TARGET" ]]; then
                echo "Invalid draft reservation for $tag." >&2
                rm -f "$notes_tmp"
                exit 1
              fi
              if remote_tag_exists "$tag"; then
                echo "Draft reservation $tag unexpectedly materialized a tag." >&2
                rm -f "$notes_tmp"
                exit 1
              fi
            fi

            rollback_armed=true
            trap 'rc=$?; rollback_published_release "$tag" "$rc"' ERR
            gh release edit "$tag" --repo "$GH_REPO" --draft=false --target "$RELEASE_TARGET" --title "$title" --notes-file "$notes_tmp"
            published_state="$(gh release view "$tag" --repo "$GH_REPO" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv')"
            IFS=$'\t' read -r published_is_draft published_is_immutable published_target_commitish <<< "$published_state"

            if [[ "$published_is_draft" == "true" ]]; then
              echo "Release $tag remained a draft after publication." >&2
              trap - ERR
              rollback_published_release "$tag" 1
            fi
            if [[ "$published_is_immutable" != "true" ]]; then
              echo "$tag did not become immutable; rolling back before failing closed." >&2
              trap - ERR
              rollback_published_release "$tag" 1
            fi

            [[ "$published_is_immutable" == "true" ]]
            rollback_armed=false
            trap - ERR

            if [[ "$published_target_commitish" != "$RELEASE_TARGET" ]]; then
              echo "Published immutable release $tag targets $published_target_commitish, expected $RELEASE_TARGET." >&2
              rm -f "$notes_tmp"
              exit 1
            fi
            git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$RELEASE_TARGET" ]]; then
              echo "$tag points to $tag_sha, expected $RELEASE_TARGET." >&2
              rm -f "$notes_tmp"
              exit 1
            fi
            rm -f "$notes_tmp"
          }

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          if [[ "${{ steps.state.outputs.initial }}" == "true" ]]; then
            if [[ "$live_main" != "$TARGET_SHA" || "$RELEASE_TARGET" != "$TARGET_SHA" ]]; then
              echo "Late publication stale-main guard failed." >&2
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$RELEASE_TARGET" "$live_main"; then
            echo "Late recovery ancestry guard failed." >&2
            exit 1
          fi

          while IFS=$'\t' read -r kind name version tag title notes_file; do
            publish_one "$kind" "$name" "$version" "$tag" "$title" "$notes_file"
          done < /tmp/release-items.tsv

      - name: Verify complete immutable release set
        if: steps.state.outputs.stale != 'true'
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_manifest.py items --format tsv > /tmp/release-items.tsv

          while IFS=$'\t' read -r kind name version tag title notes_file; do
            state="$(gh release view "$tag" --repo "$GH_REPO" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv')"
            IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
            if [[ "$is_draft" == "true" ]]; then
              echo "Final verification: release $tag is still a draft." >&2
              exit 1
            fi
            if [[ "$is_immutable" != "true" ]]; then
              echo "Final verification: release $tag is not immutable." >&2
              exit 1
            fi
            if [[ "$target" != "$RELEASE_TARGET" ]]; then
              echo "Final verification: release $tag targets $target, expected $RELEASE_TARGET." >&2
              exit 1
            fi
            git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$RELEASE_TARGET" ]]; then
              echo "Final verification: tag $tag points to $tag_sha, expected $RELEASE_TARGET." >&2
              exit 1
            fi
          done < /tmp/release-items.tsv
